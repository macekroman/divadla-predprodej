name: Aktualizace stránky

on:
  schedule:
    # každou hodinu: obnoví volná místa a dohledá sály jen u nově vypsaných představení
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      cache_only:
        description: "Jen uložené adresy sálů (rychlé, bez dotazů na server.mdb.cz)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vygenerovat stránku
        run: python mdb_predprodej.py
        env:
          MDB_OUT: site/index.html
          TZ: Europe/Prague
          MDB_CACHE_ONLY: ${{ (github.event_name == 'push' || inputs.cache_only) && '1' || '' }}

      - name: Uložit nově zjištěné adresy sálů a ceny
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add hall_urls.json prices.json
          git diff --cached --quiet || (git commit -m "Aktualizace adres sálů a cen" && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
