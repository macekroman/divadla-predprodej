name: Aktualizace stránky

on:
  schedule:
    # každou hodinu: obnoví volná místa a dohledá sály jen u nově vypsaných představení
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      cache_only:
        description: "Jen uložené adresy sálů (rychlé, bez dotazů na prodejní systémy)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Web NdB blokuje část adres GitHub Actions (zhruba polovinu serverů), proto program NdB
  # stahujeme na 4 serverech souběžně; hlavní úloha použije první úspěšný výsledek.
  ndb-program:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stáhnout program NdB
        id: fetch
        continue-on-error: true  # zablokovaný server nemá shodit celý běh
        run: python divadla_predprodej.py --ndb-program ndb_program.json

      - if: steps.fetch.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ndb-program-${{ matrix.n }}
          path: ndb_program.json
          retention-days: 1

  build:
    needs: ndb-program
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Uložená data (adresy sálů, volná místa, programy) jsou ve větvi data, ať nezanáší historii main.
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Převzít uložená data
        run: cp data/*.json .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Převzít program NdB
        uses: actions/download-artifact@v4
        continue-on-error: true  # když neuspěla žádná úloha, žádný artefakt není
        with:
          pattern: ndb-program-*
          path: ndb

      - name: Vybrat první úspěšně stažený program NdB
        run: |
          f=$(ls ndb/*/ndb_program.json 2>/dev/null | head -1)
          echo "Program NdB: ${f:-nestažen, použije se uložený}"
          echo "NDB_PROGRAM=${f:-ndb/chybi.json}" >> "$GITHUB_ENV"

      - name: Vygenerovat stránku
        run: python divadla_predprodej.py
        env:
          OUT: site/index.html
          TZ: Europe/Prague
          CACHE_ONLY: ${{ (github.event_name == 'push' || inputs.cache_only) && '1' || '' }}

      # Větev data má jediný commit, který se pokaždé přepíše – historie nenarůstá.
      # Běhy se nepřekrývají (concurrency), takže force push nic nepřepíše.
      - name: Uložit adresy sálů a volná místa podle cen
        working-directory: data
        run: |
          cp ../hall_urls.json ../seats.json ../programs.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit --amend --reset-author -m "Uložená data (adresy sálů, volná místa, programy)" && git push --force)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
