name: Diagnostika NdB

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Dostupnost webu NdB
        run: |
          echo "IP runneru: $(curl -s -4 -m 10 https://api.ipify.org)"
          for v in 4 6; do
            echo "www.ndbrno.cz IPv$v: $(curl -s -$v -m 20 -o /dev/null -w '%{http_code} %{remote_ip} %{time_total}s' https://www.ndbrno.cz/program/ || echo "chyba $?")"
          done
          echo "online.colosseum.eu: $(curl -s -m 20 -o /dev/null -w '%{http_code} %{remote_ip} %{time_total}s' https://online.colosseum.eu/hall || echo "chyba $?")"
          echo "www.mdb.cz: $(curl -s -m 20 -o /dev/null -w '%{http_code} %{remote_ip} %{time_total}s' https://www.mdb.cz/ || echo "chyba $?")"
